# فحوصات ما قبل النشر
#
# الغرض: سجل مرئي على GitHub لكل دفعة — إيه اللي نجح وإيه اللي فشل ومتى.
#
# ⚠️ الملف ده **مش** هو اللي بيمنع النشر.
# Vercel بينشر من الـPush مباشرة ومش بيستنى GitHub. اللي بيمنع النشر فعلًا
# هو إن `build` في package.json بيشغّل `verify` الأول (فحص الأنواع ثم
# الاختبارات)، وVercel بينفّذ نفس الأمر. فشل أي فحص = فشل البناء = النسخة
# القديمة تفضل شغالة والجديدة ما تنشرش.
#
# يعني الحماية في package.json، وده هنا للرؤية والتاريخ.
#
# ملاحظة على مدير الحزم: المشروع بيستخدم **bun**، و`bun.lock` هو ملف
# القفل المتتبَّع. `package-lock.json` متجاهَل عن قصد (في .gitignore)
# عشان ملفين قفل جنب بعض بيفرّقوا وينتجوا شجرة حزم مختلفة محليًا عن
# Vercel. فالفحوصات هنا لازم تستخدم bun زي ما Vercel بيعمل بالظبط —
# نسخة أولى من الملف ده استخدمت `npm ci` وفشلت لأن ملف القفل مش موجود.

name: الفحوصات

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: أنواع · اختبارات · lint · بناء
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # نسخة Node لبعض أدوات البناء. 20 اتوقف دعمها على GitHub،
      # و24 هي الافتراضية الحالية.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: تثبيت الحزم
        run: bun install --frozen-lockfile

      - name: فحص الأنواع
        run: bun run typecheck

      - name: الاختبارات
        run: bun run test

      - name: lint
        run: bun run lint

      # البناء آخر خطوة: أبطأ واحدة، ومفيش فايدة من تشغيلها لو حاجة قبلها فشلت.
      # المتغيرات وهمية عن قصد — البناء بيحتاج وجودها لا صحتها، ومفيش
      # مفتاح حقيقي بيتحط في GitHub لمجرد فحص بناء.
      - name: البناء
        run: bunx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://example.com
